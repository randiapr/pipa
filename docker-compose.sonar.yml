# SonarQube Community Build for static analysis of the pipa workspace, driven by `just sonar::up`
# and `just sonar::scan` (see sonar.just). Its own compose project, separate from
# docker-compose.yml: it isn't part of the pipa stack, needs none of its secrets, and is heavy
# enough (an embedded Elasticsearch, ~2 GiB of memory) that it should only run when asked for.
#
# Rust is analyzed natively by SonarQube. Its automatic Clippy run needs cargo, which the scanner
# image doesn't have, so it is turned off (sonar-project.properties) and `just sonar::scan`
# imports a Clippy JSON report — plus an LCOV coverage report when cargo-llvm-cov is installed —
# produced on the host under target/sonar/.

name: pipa-sonar

services:
  # UI and API on http://localhost:9100: 9000, SonarQube's own port, is RustFS's S3 API in both
  # the local and the containerized pipa stack. Its embedded database (H2) is for evaluation only,
  # which is all this is for; the volumes keep the analysis history across restarts.
  sonarqube:
    image: sonarqube:community
    environment:
      # Elasticsearch's bootstrap checks (vm.max_map_count, ...) fail on Docker Desktop/Colima
      # VMs; they only matter for a production cluster.
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9100:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  # One-shot analysis run, `just sonar::scan` only (the profile keeps `up` from starting it), which
  # sets SONAR_TOKEN and PIPA_ROOT (the repository's absolute path). The defaults below only exist
  # because compose interpolates this service on every command, `up` included. The repository is
  # mounted at its host path, so the absolute paths in the coverage report resolve as they are.
  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    # Published for amd64 only; Apple silicon runs it emulated.
    platform: linux/amd64
    profiles: ["scan"]
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_PROJECT_BASE_DIR: ${PIPA_ROOT:-/usr/src}
      # The scanner's scratch space, in the container rather than on the mounted repository: the
      # Rust analyzer is a native binary it extracts there, and it fails to start from a bind mount
      # on Docker Desktop ("Failed to start the analyzer process").
      SCANNER_WORKDIR_PATH: /tmp/scannerwork
    working_dir: ${PIPA_ROOT:-/usr/src}
    volumes:
      - ${PIPA_ROOT:-/usr/src}:${PIPA_ROOT:-/usr/src}

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
