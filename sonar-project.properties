# SonarQube analysis settings, read by the scanner `just sonar::scan` runs (docker-compose.sonar.yml).
sonar.projectKey=pipa
sonar.projectName=pipa

sonar.sources=crates
sonar.exclusions=**/target/**,crates/ui/dist/**,crates/ui/node_modules/**
sonar.sourceEncoding=UTF-8

# The scanner image has no cargo, so SonarQube can't run Clippy itself; `just sonar::scan` runs it on
# the host and imports the report instead (with both on, every Clippy issue would show up twice).
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
# Written by `just sonar::scan` only when cargo-llvm-cov is installed; a missing file is skipped.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
