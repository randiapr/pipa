# Ingestion coordination and the backend's query cache. Nothing here has to survive a restart, so
# there is no volume; it holds query results, so it has no Service outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.2-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
