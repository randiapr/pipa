apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/randiapr/pipa-backend
          envFrom:
            - configMapRef: {name: pipa-config}
          env:
            - name: RUSTFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: pipa-secrets, key: rustfs-access-key}
            - name: RUSTFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: pipa-secrets, key: rustfs-secret-key}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: pipa-secrets, key: jwt-secret}
            - name: PIPA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: pipa-secrets, key: admin-password}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
