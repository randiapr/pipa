name: Publish images

# Runs when a release is published (the draft that draft-release.yaml maintains), not on merges:
# the images get the semver tags of its vX.Y.Z tag, i.e. `X.Y.Z`, `X.Y` and, from 1.0 on, `X`,
# plus `sha-<short>` and `latest` (metadata-action adds `latest` itself for a non-prerelease).
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# Queue rather than cancel: if two releases are published close together, `latest` must end up
# on the newer one, which a cancelled-then-skipped run could leave behind.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push (backend, ingestion, ui)
    runs-on: ubuntu-latest
    steps:
      # Checks out the release's tag, so the images are built from the exact commit released.
      - uses: actions/checkout@v4

      # The `ui` image only packages crates/ui/dist/ (see the Dockerfile), so the dashboard is
      # built here with Trunk first, exactly as `just build-ui-release` does locally.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # Trunk's Tailwind pipeline resolves `@plugin "daisyui"` from node_modules (see CLAUDE.md).
      - run: npm ci
        working-directory: crates/ui

      - run: trunk build --release
        working-directory: crates/ui

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image names (GHCR requires it; the owner can be
      # mixed-case on a fork). The semver rules skip `X` while the major is 0.
      - name: Tags for pipa-backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pipa-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Tags for pipa-ingestion
        id: meta-ingestion
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pipa-ingestion
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Tags for pipa-ui
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pipa-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      # The three builds share one buildx builder, so the Dockerfile's `builder` stage (the
      # whole `cargo build --release`) is compiled by the first and reused by the next two.
      # linux/amd64 only: building Rust under QEMU for arm64 would take hours.
      - name: Push pipa-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push pipa-ingestion
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ingestion
          push: true
          tags: ${{ steps.meta-ingestion.outputs.tags }}
          labels: ${{ steps.meta-ingestion.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push pipa-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
