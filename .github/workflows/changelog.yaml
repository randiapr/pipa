name: Changelog

on:
  pull_request:
    branches:
      - main
    # labeled/unlabeled so adding or removing `skip-changelog` re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    # Escape hatch for changes that don't warrant a release (tests, internal refactors, ...).
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: .github/scripts/check-changelog.sh "origin/${{ github.base_ref }}"
