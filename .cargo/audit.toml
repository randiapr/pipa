# Read by `cargo audit`, so by `just audit` and the audit workflow alike.
[advisories]
ignore = [
    # Marvin attack on RSA decryption. `rsa` comes in through jsonwebtoken's `rust_crypto` feature,
    # and pipa-backend only signs and verifies HS256 tokens (HMAC), so no RSA key is ever used.
    # No patched `rsa` release exists. Revisit when one does or jsonwebtoken drops the dependency.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5: timing side channels in operations meant to be constant-time. It comes
    # in only through jsonwebtoken's `rust_crypto` feature, for its ES256/ES384 curves (p256 and
    # p384, via elliptic-curve 0.13), and pipa-backend only signs and verifies HS256 tokens (HMAC),
    # so no elliptic-curve key is ever used. Fixed in 0.7.6 only, which elliptic-curve 0.13 can't
    # use. Revisit when jsonwebtoken moves to newer RustCrypto curves.
    "RUSTSEC-2026-0387",
]
