[workspace]
resolver = "3"
members = ["crates/backend", "crates/ingestion", "crates/storage", "crates/ui"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
pipa-storage = { path = "crates/storage" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
datafusion = "53.1.0"
futures = "0.3.34"
gloo-net = { version = "0.6.0", features = ["json"] }
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-datafusion = "0.10.1"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
log = "0.4.34"
object_store = { version = "0.14.2", features = ["aws"] }
pgwire-replication = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "mysql"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
wasm-bindgen = "0.2.128"
