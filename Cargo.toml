[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/backend",
    "crates/catalog-proxy",
    "crates/ingestion",
    "crates/ui",
]

[workspace.package]
edition = "2024"
license = "MIT"

# Debug info is the bulk of target/ (the datafusion/iceberg/sqlx graph is huge). Keep line
# tables for the workspace's own crates so panics/backtraces still show file:line, and drop
# debug info entirely for third-party deps. Applies to the test profile too (it inherits dev).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
datafusion = "53.1.0"
futures = "0.3.34"
gloo-net = { version = "0.7.0", features = ["json"] }
hmac = "0.13.0"
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-datafusion = "0.10.1"
iceberg-storage-opendal = "0.10.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = [
    "rust_crypto",
] }
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
log = "0.4.34"
object_store = { version = "0.14.2", features = ["aws"] }
parquet = "58.4.0"
pgwire-replication = "0.4.1"
pipa-api = { path = "crates/api" }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "mysql"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v7", "serde"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = [
    "EventTarget",
    "MediaQueryList",
    "MediaQueryListEvent",
    "Storage",
    "Window",
] }
