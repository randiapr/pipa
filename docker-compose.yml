# Containerized equivalent of `just local::up` (see local.just).
#
# No separate Iceberg REST catalog service is included: RustFS itself serves one natively via
# its "S3 Tables" feature, at the same host/port as its S3 API under an /iceberg path prefix.
# Two things sit between it and pipa's Iceberg clients here, both automated below:
#   - S3 Tables is opt-in per bucket; `catalog` turns it on for the "pipa" bucket at startup.
#   - The catalog requires every request to be AWS SigV4-signed (signing name "s3"), which
#     iceberg-catalog-rest can't do, so `catalog` is a small signing reverse proxy
#     (crates/catalog-proxy) in front of it. pipa-backend (querying, POST /query) and pipa-ingestion
#     (writing captured changes, crates/ingestion/src/write/) point their own independent
#     ICEBERG_CATALOG_URI at that proxy instead of at RustFS directly.
#
# Quickstart: cp .env.example .env (fill in the secrets), then docker compose up --build

x-pipa-ingestion-build: &pipa-ingestion-build
  context: .
  target: ingestion

x-pipa-ingestion-env: &pipa-ingestion-env
  RUSTFS_ENDPOINT: http://rustfs:9000
  RUSTFS_BUCKET: pipa
  RUSTFS_REGION: ap-southeast-3
  RUSTFS_ACCESS_KEY_ID: rustfsadmin
  RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
  RUSTFS_ALLOW_HTTP: "true"
  ICEBERG_CATALOG_URI: http://catalog:8080/iceberg
  INGESTION_SHARD_COUNT: "2"
  RUST_LOG: info

services:
  # S3-compatible object store backing both the Iceberg REST catalog's metadata files
  # and pipa's own direct table data/metadata access (crates/backend/src/storage.rs).
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    command: ["/data"]
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Example OLTP source for local CDC testing: register it as a data source via pipa-backend's
  # /datasources API (or pipa-ui) pointing at postgres:5432, then pipa-ingestion picks it up on
  # its own read of the shared object store (see crates/ingestion/src/datasource.rs). wal_level
  # must be logical for PostgresWalSource's replication slot (crates/ingestion/src/capture/
  # infrastructure/postgres) — the default "replica" won't support logical decoding.
  example-source:
    image: postgres:18.2-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: pipa
      POSTGRES_PASSWORD: pipa
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipa -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: ensures the "pipa" bucket exists before anything tries to read/write it.
  # rustfs/rc ships the `rc` CLI (RustFS's mc-equivalent, also used by `just rustfs-init`) —
  # not curl — so this ensures the bucket the same way, rather than hand-rolling sigv4 requests.
  create-bucket:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        rc alias set pipa http://rustfs:9000 rustfsadmin rustfsadmin &&
        rc bucket create pipa/pipa --ignore-existing

  # SigV4-signing reverse proxy in front of RustFS's Iceberg REST catalog (crates/catalog-proxy,
  # no AWS dependency): signs each request with RustFS's credentials (signing name "s3") and
  # forwards it over plain HTTP. File IO (data/metadata files) still goes to RustFS directly.
  # On startup it also enables S3 Tables on the bucket, so no manual step is needed.
  catalog:
    build:
      context: .
      target: catalog-proxy
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: pipa
      RUSTFS_REGION: ap-southeast-3
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      RUST_LOG: info

  backend:
    build:
      context: .
      target: backend
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    environment:
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: pipa
      RUSTFS_REGION: ap-southeast-3
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      RUSTFS_ALLOW_HTTP: "true"
      ICEBERG_CATALOG_URI: http://catalog:8080/iceberg
      # Login: JWT_SECRET signs tokens (>= 32 bytes); the PIPA_ADMIN_* pair creates the first
      # admin when no user exists yet. Compose refuses to start without them — put them in a
      # `.env` file next to this one (see .env.example), never commit real values.
      JWT_SECRET: ${PIPA_JWT_SECRET:?set PIPA_JWT_SECRET to a random string of at least 32 bytes}
      PIPA_ADMIN_USERNAME: ${PIPA_ADMIN_USERNAME:-admin}
      PIPA_ADMIN_PASSWORD: ${PIPA_ADMIN_PASSWORD:?set PIPA_ADMIN_PASSWORD for the first admin}
      # Browser origins allowed to call the API, comma-separated: the ui service below by
      # default. Set CORS_ALLOWED_ORIGINS in `.env` when the dashboard is served elsewhere.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RUST_LOG: info
    ports:
      - "8080:8080"

  # Standalone: no dependency on any other crate in this workspace (see the module doc on
  # crates/ingestion/src/main.rs), so it's a separate `build.target` here rather than
  # something wired through pipa-backend — it keeps its own independent copy of
  # the iceberg/iceberg-catalog-rest dependency (crates/ingestion/src/write/) to land captured
  # changes as changelog rows, separate from pipa-backend's own copy used for querying.
  # Distributed across INGESTION_SHARD_COUNT instances below (a Postgres replication slot only
  # tolerates one consumer, so each source's id is statically partitioned by shard — see
  # shard_of() in main.rs); bump the shared INGESTION_SHARD_COUNT anchor and add matching
  # ingestion-N services to scale further. All shards share one `image:` tag, so compose
  # builds pipa-ingestion once and every shard's container just runs it — not one build per
  # shard.
  ingestion-0:
    image: pipa-ingestion
    build: *pipa-ingestion-build
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    environment:
      <<: *pipa-ingestion-env
      INGESTION_SHARD_INDEX: "0"

  ingestion-1:
    image: pipa-ingestion
    build: *pipa-ingestion-build
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    environment:
      <<: *pipa-ingestion-env
      INGESTION_SHARD_INDEX: "1"

  # Trunk-built wasm32 SPA (crates/ui/), served statically by static-web-server. The host's native
  # Trunk does the build (`just build-ui-release`, which `just docker-up` runs first — plain
  # `docker compose up --build` needs it done beforehand); the `ui` stage in Dockerfile only
  # packages crates/ui/dist/. It talks to `backend` from the browser at the compile-time
  # API_BASE (localhost:8080, published above), not container-to-container, so `depends_on`
  # here is just for a sane startup order, not a network dependency.
  ui:
    build:
      context: .
      target: ui
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  rustfs-data:
  postgres-data:
