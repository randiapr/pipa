# Containerized equivalent of `just local::up` (see local.just).
#
# No separate Iceberg REST catalog service is included: RustFS itself serves one natively via
# its "S3 Tables" feature, at the same host/port as its S3 API under an /iceberg path prefix.
# Two things sit between it and pipa's Iceberg clients, both handled inside pipa-backend
# (querying, POST /query) and pipa-ingestion (writing captured changes,
# crates/ingestion/src/write/) themselves, with no extra service or network hop:
#   - The catalog requires every request to be AWS SigV4-signed (signing name "s3"), which
#     iceberg-catalog-rest can't do, so each of them embeds the pipa-catalog-proxy signer
#     (crates/catalog-proxy) on a loopback port of its own process and points its catalog
#     client there. Leaving ICEBERG_CATALOG_URI unset is what selects this.
#   - S3 Tables is opt-in per bucket; each of them turns it on for RUSTFS_BUCKET at startup.
#
# The pipa images are the published ones (ghcr.io/randiapr/pipa-*:latest, see
# .github/workflows/publish-images.yaml), pulled rather than built. `latest` is the newest
# non-prerelease release; pin PIPA_IMAGE_TAG in `.env` (e.g. 0.5.0) to stay on a specific one.
# Compose only pulls an image that isn't local yet: run `docker compose pull` to fetch a newer `latest`.
#
# The images are multi-arch (linux/amd64 and linux/arm64), so each host pulls its native one.
#
# Quickstart: cp .env.example .env (fill in the secrets), then docker compose up

x-pipa-ingestion-image: &pipa-ingestion-image ghcr.io/randiapr/pipa-ingestion:${PIPA_IMAGE_TAG:-latest}

x-pipa-ingestion-env: &pipa-ingestion-env
  RUSTFS_ENDPOINT: http://rustfs:9000
  RUSTFS_BUCKET: pipa
  RUSTFS_REGION: ap-southeast-3
  RUSTFS_ACCESS_KEY_ID: rustfsadmin
  RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
  RUSTFS_ALLOW_HTTP: "true"
  # Instances find each other through Redis and share the registered sources between them: add
  # or remove an ingestion-N service freely, and a stopped one's sources move to the others.
  REDIS_URL: redis://redis:6379
  # How often each instance re-reads the registered data sources: new sources start capturing,
  # removed ones stop, and a changed table choice (the dashboard's data source explorer) applies
  # without a restart.
  INGESTION_SOURCE_REFRESH_INTERVAL_SECS: "30"
  RUST_LOG: info

services:
  # S3-compatible object store backing both the Iceberg REST catalog's metadata files
  # and pipa's own direct table data/metadata access (crates/backend/src/storage.rs).
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    command: ["/data"]
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Coordination for the pipa-ingestion instances below (who is alive, and which of them captures
  # which data source: crates/ingestion/src/coordination/) and pipa-backend's cache of query
  # results (crates/backend/src/cache/). Nothing here has to survive a restart, so there is no
  # volume and no persistence. It holds query results: don't publish its port.
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Example OLTP source for local CDC testing: register it as a data source via pipa-backend's
  # /datasources API (or pipa-ui) pointing at example-source:5432 — pipa-backend connects to it
  # from inside the compose network to test it and list its tables — then choose the tables to
  # capture in the dashboard's data source explorer; a new source captures none. pipa-ingestion
  # picks it up on its next read of the shared object store (see
  # crates/ingestion/src/datasource.rs). wal_level
  # must be logical for PostgresWalSource's replication slot (crates/ingestion/src/capture/
  # infrastructure/postgres) — the default "replica" won't support logical decoding.
  example-source:
    image: postgres:18.6-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: pipa
      POSTGRES_PASSWORD: pipa
      POSTGRES_DB: testdb
      # The 18+ images default to /var/lib/postgresql/18/docker and refuse to start on data
      # mounted at the pre-18 path; pin PGDATA to it so the existing postgres-data volume is used
      # as-is. Dropping this means mounting the volume at /var/lib/postgresql instead, on a fresh
      # volume.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipa -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: ensures the "pipa" bucket exists before anything tries to read/write it.
  # rustfs/rc ships the `rc` CLI (RustFS's mc-equivalent, also used by `just rustfs-init`) —
  # not curl — so this ensures the bucket the same way, rather than hand-rolling sigv4 requests.
  create-bucket:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        rc alias set pipa http://rustfs:9000 rustfsadmin rustfsadmin &&
        rc bucket create pipa/pipa --ignore-existing

  backend:
    image: ghcr.io/randiapr/pipa-backend:${PIPA_IMAGE_TAG:-latest}
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Shared cache of POST /query results and the table list. Unset, each backend instance
      # keeps a small cache in its own memory. CACHE_QUERY_TTL_SECS/CACHE_TABLES_TTL_SECS (30)
      # bound how stale a result can be; 0 turns that cache off.
      REDIS_URL: redis://redis:6379
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: pipa
      RUSTFS_REGION: ap-southeast-3
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      RUSTFS_ALLOW_HTTP: "true"
      # Login: JWT_SECRET signs tokens (>= 32 bytes); the PIPA_ADMIN_* pair creates the first
      # admin when no user exists yet. Compose refuses to start without them — put them in a
      # `.env` file next to this one (see .env.example), never commit real values.
      JWT_SECRET: ${PIPA_JWT_SECRET:?set PIPA_JWT_SECRET to a random string of at least 32 bytes}
      PIPA_ADMIN_USERNAME: ${PIPA_ADMIN_USERNAME:-admin}
      PIPA_ADMIN_PASSWORD: ${PIPA_ADMIN_PASSWORD:?set PIPA_ADMIN_PASSWORD for the first admin}
      # Browser origins allowed to call the API, comma-separated: the ui service below by
      # default. Set CORS_ALLOWED_ORIGINS in `.env` when the dashboard is served elsewhere.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RUST_LOG: info
    ports:
      - "8080:8080"

  # Standalone: no dependency on pipa-backend, only on the embedded catalog signer (see the module
  # doc on crates/ingestion/src/main.rs), so it's a separate image here rather than
  # something wired through pipa-backend — it keeps its own independent copy of
  # the iceberg/iceberg-catalog-rest dependency (crates/ingestion/src/write/) to land captured
  # changes as changelog rows, separate from pipa-backend's own copy used for querying.
  # Distributed across the ingestion-N instances below: a Postgres replication slot only tolerates
  # one consumer, so each source is captured by exactly one of them, chosen through Redis (see
  # crates/ingestion/src/coordination/). Add another ingestion-N service to scale out. All of them
  # share one image (the x-pipa-ingestion-image anchor), so it is pulled once and every container
  # just runs it. INGESTION_INSTANCE_ID names each one among its peers and must be unique; being
  # stable, it lets a restarted container pick its sources up where it left off.
  ingestion-0:
    image: *pipa-ingestion-image
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *pipa-ingestion-env
      INGESTION_INSTANCE_ID: ingestion-0

  ingestion-1:
    image: *pipa-ingestion-image
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *pipa-ingestion-env
      INGESTION_INSTANCE_ID: ingestion-1

  # Trunk-built wasm32 SPA (crates/ui/), served statically by static-web-server. The published
  # image only packages crates/ui/dist/, built by CI (publish-images.yaml). It talks to `backend`
  # from the browser at the compile-time API_BASE (localhost:8080, published above), not container-to-container, so `depends_on`
  # here is just for a sane startup order, not a network dependency.
  ui:
    image: ghcr.io/randiapr/pipa-ui:${PIPA_IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  rustfs-data:
  postgres-data:
